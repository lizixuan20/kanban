name: update-data
on:
  schedule:
    # UTC 08:20 = 北京时间 16:20，周一到周五
    - cron: '20 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pandas

      - name: Rebuild data.js
        run: python scripts/build_data.py data.js

      - name: Commit & push
        run: |
          git config user.name "kanban-bot"
          git config user.email "kanban-bot@users.noreply.github.com"
          git add data.js
          git diff --quiet && echo "no change" && exit 0
          git commit -m "auto: update market data"
          git push
